<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mangalam Starview – Sales Dashboard</title>
<style>
:root{--sb:linear-gradient(#0b2a5b,#071a3c);--bg:#f3f6fc;--card:#fff;--tx:#0f1f3d;--mu:#64748b;--bd:#e2e8f3;--pr:#1d5fd1;--nv:#0b2a5b;--in:#f8fafd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a111f;--card:#121b2e;--tx:#e6edf8;--mu:#93a3ba;--bd:#233049;--in:#0e1627}}
:root[data-theme=dark]{--bg:#0a111f;--card:#121b2e;--tx:#e6edf8;--mu:#93a3ba;--bd:#233049;--in:#0e1627}
:root[data-theme=sand]{--bg:#f6efe2;--card:#fffaf0;--tx:#3a2e1f;--mu:#85704f;--bd:#e6d9bf;--in:#f9f2e3;--pr:#a8641a;--sb:linear-gradient(#6b543a,#40301f)}
:root[data-theme=snow]{--bg:#eef3f8;--card:#fff;--tx:#1f2d3d;--mu:#62748a;--bd:#dde6ef;--in:#f6f9fc;--pr:#3a86c8;--sb:linear-gradient(#3b516a,#26374a)}
:root[data-theme=vista]{--bg:linear-gradient(135deg,#cde7f7,#e6f5ee 55%,#cfe3f4);--card:#ffffffcc;--tx:#10304d;--mu:#4a6b86;--bd:#b4d0e4;--in:#eaf5fc;--pr:#1f78c1;--sb:linear-gradient(#3a86c9,#0e3f73 65%,#092a50)}
[data-theme=starview]{color-scheme:dark}
:root[data-theme=starview]{--bg:radial-gradient(1px 1px at 22px 34px,#fff,transparent) 0 0/240px 240px,radial-gradient(1px 1px at 120px 90px,#ffffffb0,transparent) 0 0/240px 240px,radial-gradient(1.5px 1.5px at 190px 160px,#fff,transparent) 0 0/240px 240px,radial-gradient(1px 1px at 70px 200px,#ffffff90,transparent) 0 0/240px 240px,linear-gradient(#08111f,#0c1c38);--card:#101d36eb;--tx:#f1ead8;--mu:#a3aec4;--bd:#2b3a5a;--in:#0c192e;--pr:#c9a05a;--sb:linear-gradient(#0c1a33,#070f1e)}
[data-theme=starview] header{background:#0b1830eb}
[data-theme=starview] header h2,[data-theme=starview] .card h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;color:#e0bd7a}
[data-theme=starview] .btn:not(.o),[data-theme=starview] nav button.on{color:#1b1406}
[data-theme=starview] .card{box-shadow:0 0 0 1px #c9a05a26}
[data-theme=starview] svg rect[fill="#1e4fa8"]{fill:#d9b46a}
:root[data-theme=m-purple]{--bg:#FEF7FF;--card:#fff;--tx:#1D1B20;--mu:#49454F;--bd:#CAC4D0;--in:#F3EDF7;--pr:#6750A4;--sb:linear-gradient(#4F378B,#381E72)}
:root[data-theme=m-blue]{--bg:#F8F9FF;--card:#fff;--tx:#191C20;--mu:#44474E;--bd:#C4C6D0;--in:#EAF0FB;--pr:#0B57D0;--sb:linear-gradient(#0842A0,#062E6F)}
:root[data-theme=m-teal]{--bg:#F4FBFA;--card:#fff;--tx:#161D1D;--mu:#3F4948;--bd:#BEC9C8;--in:#E0F0EF;--pr:#006A6A;--sb:linear-gradient(#004F50,#003737)}
:root[data-theme=m-green]{--bg:#F8FAF0;--card:#fff;--tx:#191D16;--mu:#44483E;--bd:#C4C8BB;--in:#E8F0DD;--pr:#386A20;--sb:linear-gradient(#205107,#0F3800)}
:root[data-theme=m-indigo]{--bg:#FBF8FF;--card:#fff;--tx:#1B1B1F;--mu:#46464F;--bd:#C6C5D0;--in:#EEEFFC;--pr:#4355B9;--sb:linear-gradient(#2E40A1,#1A2677)}
:root[data-theme=m-red]{--bg:#FFF8F7;--card:#fff;--tx:#201A19;--mu:#534341;--bd:#D8C2BF;--in:#FCEAE8;--pr:#BA1A1A;--sb:linear-gradient(#93000A,#690005)}
:root[data-theme=m-pink]{--bg:#FFF8F8;--card:#fff;--tx:#201A1B;--mu:#524345;--bd:#D6C1C7;--in:#FDEAF0;--pr:#984061;--sb:linear-gradient(#7D2A4B,#55112F)}
:root[data-theme=m-amber]{--bg:#FFF8F4;--card:#fff;--tx:#201B16;--mu:#51453A;--bd:#D8C3AD;--in:#FDEBD8;--pr:#8B5000;--sb:linear-gradient(#6B3B00,#452400)}
:root[data-theme=m-cyan]{--bg:#F5FAFD;--card:#fff;--tx:#171C1F;--mu:#40484C;--bd:#BFC8CC;--in:#E1F0F7;--pr:#006782;--sb:linear-gradient(#004D64,#003548)}
:root[data-theme=m-slate]{--bg:#F7F9FB;--card:#fff;--tx:#191C1E;--mu:#43474B;--bd:#C5CBD1;--in:#E7ECF0;--pr:#455A64;--sb:linear-gradient(#37474F,#263238)}
[data-theme^=m-] .card{border-radius:16px;box-shadow:0 1px 2px #0000001f}[data-theme^=m-] svg rect[fill="#1e4fa8"]{fill:var(--pr)}[data-theme^=m-] nav button{border-radius:0 24px 24px 0;width:calc(100% - 10px)}
/* festive themes */
:root[data-theme=diwali]{--bg:linear-gradient(160deg,#1a0508,#3b0f0a 55%,#4a1a05);--card:#2a0d0aeb;--tx:#fff1d6;--mu:#d8b48a;--bd:#6a3418;--in:#220a07;--pr:#f59e0b;--sb:linear-gradient(#6b1d0a,#2a0805)}
:root[data-theme=christmas]{--bg:linear-gradient(160deg,#07221a,#0f3b2a 55%,#4a0f14);--card:#0f2f23eb;--tx:#f6f1e7;--mu:#a9c9b8;--bd:#2f6a4c;--in:#0a241b;--pr:#c0392b;--sb:linear-gradient(#7a1118,#2a0508)}
[data-theme=diwali],[data-theme=christmas]{color-scheme:dark}
[data-theme=diwali] header{background:#2a0d0aeb;border-bottom:3px solid transparent;border-image:repeating-linear-gradient(90deg,#f59e0b 0 10px,#ef4444 10px 20px,#fbbf24 20px 30px) 1}
[data-theme=christmas] header{background:#0f2f23eb;border-bottom:3px solid transparent;border-image:repeating-linear-gradient(90deg,#ef4444 0 10px,#22c55e 10px 20px,#facc15 20px 30px) 1}
[data-theme=diwali] header h2,[data-theme=diwali] .card h3{color:#ffc857}
[data-theme=christmas] header h2,[data-theme=christmas] .card h3{color:#f5d76e}
[data-theme=diwali] header h2::after{content:" 🪔 Happy Diwali";font-size:14px;font-weight:400}
[data-theme=christmas] header h2::after{content:" 🎄 Merry Christmas";font-size:14px;font-weight:400}
[data-theme=diwali] .btn:not(.o),[data-theme=diwali] nav button.on,[data-theme=diwali] .tb.on{color:#2a1200}
[data-theme=diwali] svg rect[fill="#1e4fa8"]{fill:#fbbf24}[data-theme=christmas] svg rect[fill="#1e4fa8"]{fill:#ef4444}
[data-theme=diwali] .card{box-shadow:0 0 0 1px #f59e0b30}[data-theme=christmas] .card{box-shadow:0 0 0 1px #ffffff1a}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;display:none}
[data-theme=diwali] body::before{display:block;background-image:radial-gradient(2px 2px at 20px 30px,#ffd36b,transparent),radial-gradient(1.5px 1.5px at 90px 70px,#ff9f43,transparent),radial-gradient(2px 2px at 150px 120px,#fff1a8,transparent),radial-gradient(1.5px 1.5px at 60px 160px,#ffb347,transparent);background-size:200px 200px;animation:tw 3s ease-in-out infinite alternate}
[data-theme=christmas] body::before{display:block;background-image:radial-gradient(3px 3px at 20px 20px,#fff,transparent),radial-gradient(2px 2px at 100px 80px,#fffc,transparent),radial-gradient(2.5px 2.5px at 160px 150px,#fff,transparent),radial-gradient(2px 2px at 60px 130px,#ffffffb0,transparent);background-size:200px 200px;animation:snow 14s linear infinite}
@keyframes tw{from{opacity:.35}to{opacity:1}}@keyframes snow{to{background-position:0 200px}}
@media(prefers-reduced-motion:reduce){body::before{animation:none!important}}
[data-theme=vista] header{background:#ffffffb3;backdrop-filter:blur(8px)}
[data-theme=vista] .card{backdrop-filter:blur(6px);border-radius:12px;box-shadow:inset 0 1px #fff,0 2px 10px #1b4b8a2e}
:root[data-theme=gold]{--bg:#faf3dc;--card:#fffdf5;--tx:#3b2f0b;--mu:#80692a;--bd:#ead9a0;--in:#fbf5de;--pr:#9a7209;--sb:linear-gradient(#5e4a12,#2f2408)}
:root[data-theme=silver]{--bg:#eceff2;--card:#fafbfc;--tx:#22272e;--mu:#667079;--bd:#d3d8de;--in:#f3f5f7;--pr:#4b5d73;--sb:linear-gradient(#5b6572,#2c333c)}
:root[data-theme=burgundy]{--bg:#f8eef0;--card:#fffafa;--tx:#3a1620;--mu:#80505b;--bd:#ecd3d8;--in:#fbf1f3;--pr:#800020;--sb:linear-gradient(#6d1427,#3a0912)}
[data-theme=gold] header{background:linear-gradient(#fffbea,#f3e6b3)}
[data-theme=silver] header{background:linear-gradient(#fff,#e1e6eb)}
[data-theme=burgundy] header{background:linear-gradient(#fffafa,#f3dde1)}
[data-theme=gold] .card,[data-theme=silver] .card,[data-theme=burgundy] .card{box-shadow:0 1px 3px #0000001a}
[data-theme=sand] .card,[data-theme=snow] .card{box-shadow:0 1px 3px #0000000f}
#lg{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:16px}#lg .bx{width:100%;max-width:380px;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}#lg .hd{background:var(--sb);padding:18px}#lg .hd img{display:block;width:100%}#lg .hd img+img{margin-top:12px}#lg .bd{padding:18px;display:grid;gap:12px}
.tb{padding:8px 18px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);cursor:pointer;font:inherit}.tb.on{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:600}[data-theme=starview] .tb.on,[data-theme=gold] .tb.on{color:#1b1406}
.mx{display:grid;grid-template-columns:70px repeat(8,minmax(112px,1fr));gap:8px;min-width:1000px}.mh{text-align:center;font-size:12px;font-weight:700;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:4px;letter-spacing:.04em}.bg{font-size:11px;padding:1px 8px;border-radius:5px;font-weight:700}.b3{background:#e3e6ff;color:#3d3fc4}.b2{background:#d5f3ef;color:#0f766e}.mf{border:1px solid var(--bd);background:var(--in);border-radius:10px;display:grid;place-content:center;text-align:center;font-size:11px;color:var(--mu)}.mf b{font-size:16px;color:var(--tx);display:block}.mc{border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;background:var(--card)}.mc:hover{box-shadow:0 2px 8px #0003}.mc .r1{display:flex;justify-content:space-between;align-items:center}.mc b{font-size:15px}.mc small{display:block;color:var(--mu);margin:4px 0 8px}.mc .st{font-size:11px;font-weight:700;letter-spacing:.06em}
@keyframes fl{50%{box-shadow:0 0 0 4px #dc2626}}
html,body{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex}
aside{width:230px;background:var(--sb);color:#dbe6fb;display:flex;flex-direction:column;flex-shrink:0;height:100%;position:sticky;top:0}
.brand{padding:18px 16px;font-weight:700;font-size:16px;color:#fff;border-bottom:1px solid #ffffff1a}.brand img{display:block;width:100%;height:auto}.brand .lg2{margin-top:12px}.brand small{display:block;font-weight:400;font-size:12px;color:#9db4de}
nav{flex:1;overflow:auto;padding-top:8px}nav button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;padding:12px 18px;text-align:left;cursor:pointer;border-left:3px solid transparent}
nav button:hover{background:#ffffff12}nav button.on{background:var(--pr);border-left-color:#7fb0ff;color:#fff}
.tag{padding:18px;color:#fff;font-weight:600}.tag small{display:block;font-weight:400;color:#9db4de}
main{flex:1;min-width:0;overflow:auto;height:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--bd);gap:12px;flex-wrap:wrap}
header h2{margin:0;font-size:20px}header span{color:var(--mu);font-size:13px}
.hr{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{background:var(--nv);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:700}
.wrap{padding:20px 24px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.k{display:flex;gap:14px;align-items:center}.ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;flex-shrink:0}
.k small{color:var(--mu)}.k b{display:block;font-size:26px;line-height:1.2}
.g3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px}.g3b{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:16px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
select,input{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit}
.btn{background:var(--pr);color:#fff;border:0;border-radius:6px;padding:9px 20px;cursor:pointer;font-weight:600;font:inherit}.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}
.ov{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;text-align:left;background:var(--in)}
th,td{padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}tfoot td{font-weight:700}
.pb{display:inline-block;width:70px;height:6px;background:var(--bd);border-radius:4px;vertical-align:middle;overflow:hidden}.pb i{display:block;height:100%}
a.v{color:var(--pr);font-size:12px;cursor:pointer}
.us{display:grid;grid-template-columns:60px 1fr 34px 46px;gap:8px;align-items:center;margin:14px 0}.us .pb{width:100%}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;margin-right:4px}
.inv{display:flex;gap:4px;align-items:center;margin:3px 0}.inv span{width:12px;color:var(--mu);font-size:11px}
.u{width:48px;height:26px;border-radius:4px;font-size:10px;display:grid;place-items:center;color:#fff;cursor:pointer;border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}textarea{width:100%;height:220px;font:12px monospace;background:var(--in);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px}
@media(max-width:1000px){.kp{grid-template-columns:1fr 1fr}.g3,.g3b,.g2{grid-template-columns:1fr}.fl{grid-template-columns:1fr 1fr}}
@media(max-width:760px){body{flex-direction:column}aside{width:100%;height:auto;position:static}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap;width:auto;padding:10px 14px}.tag{display:none}main{height:auto;overflow:visible}.wrap{padding:14px}.brand{display:flex;align-items:center;gap:12px;padding:10px 12px}.brand img{width:auto;max-height:44px;flex:0 0 auto}.brand .lg2{margin-top:0;max-height:56px}header{padding:10px 14px}}
</style></head><body>

function gsRead(key){

  if(!gsConfigured())return reject({code:'missing_script_url'});
  const cb='__gs_cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);

  const timer=setTimeout(()=>{cleanup();reject({code:'read_timeout'})},15000);
  function cleanup(){clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}script.remove()}
  window[cb]=(result)=>{cleanup();if(result&&result.ok)resolve(result);else reject({code:(result&&result.error)||'read_failed'})};
  script.onerror=()=>{cleanup();reject({code:'read_failed'})};
  script.src=GS_WEB_APP_URL+'?action=get&key='+encodeURIComponent(key)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
  document.head.appendChild(script);

}

let TEAMV=false,tTw='',tCf='',tSt='',tSub=false,tPrev=null,tLive=false,tLast='',tErr='',tNone=false,tFlash=new Set();
const TS={Refuge:['Refugee','#a9713a'],Available:['Available','#16a34a'],Sold:['Booked','#dc2626'],Reserved:['Blocked','#d19a14'],'On Hold':['Blocked','#d19a14']};
function teamMode(){TEAMV=true;['aside','main','#lg'].forEach(q=>{const e=document.querySelector(q);if(e)e.style.display='none'});let t=$('#team');if(!t){t=document.createElement('div');t.id='team';t.style.cssText='flex:1;min-width:0;height:100%;overflow:auto;padding:18px 22px';document.body.appendChild(t)}t.style.display='block';if(DBH)teamSub();teamRender()}
const isAdm=()=>{try{return sessionStorage.getItem('auth')=='1'}catch(x){return false}};
function exitTeam(){TEAMV=false;const t=$('#team');if(t)t.style.display='none';document.querySelector('aside').style.display='';document.querySelector('main').style.display='';let a=false;try{a=sessionStorage.getItem('auth')=='1'}catch(x){}if(!a){try{sessionStorage.removeItem('tauth');sessionStorage.removeItem('cred')}catch(x){}}$('#lg').style.display=a?'none':'flex';render()}
function teamSub(){if(tSub||!DBH)return;tSub=true;DBH.doc('appdata/live').onSnapshot(x=>{if(!x.exists){tNone=true;teamRender();return}const j=x.data().j;if(j===tLast)return;tLast=j;let d;try{d=JSON.parse(j)}catch(e){return}const before=new Map(U.map(u=>[u.id,u.s]));apply(d);tLive=true;const ch=[];U.forEach(u=>{const o=before.get(u.id);if(o!==undefined&&o!==u.s)ch.push(u)});if(tPrev!==null){ch.forEach(u=>{const k=TS[u.s][0];toast(k=='Booked'?'🔴 Unit '+u.id+' is now Booked':k=='Blocked'?'🟡 Unit '+u.id+' was just blocked':'🟢 Unit '+u.id+' is available again')});tFlash=new Set(ch.map(u=>u.id))}tPrev=1;teamRender();if(tFlash.size)setTimeout(()=>{tFlash=new Set();teamRender()},4500)},er=>{tLive=false;tErr=(er&&er.code)||'error';teamRender()})}
function tf(k,v){if(k=='t')tTw=v;else if(k=='c')tCf=v;else tSt=v;teamRender()}
function teamRender(){const t=$('#team');if(!t||!TEAMV)return;if(!tLive){const m=typeof claude==='undefined'||!DBH?'You are not signed in to claude.ai, or this link has not been shared with your account. Sign in to claude.ai with the account your admin invited, then open this link again.':tErr?'Your account can open this page but cannot read the live list ('+tErr+'). Ask your admin to share the link with you with at least Viewer access.':tNone?'The admin has not published the live inventory yet. Ask the admin to open the dashboard once and log in.':'Connecting to the live inventory...';t.innerHTML=`<div class=row style="justify-content:space-between;margin-bottom:14px"><div class=row><img src="${document.querySelector('.lg1').src}" style="height:44px"><img src="${document.querySelector('.lg2').src}" style="height:56px"></div><button class="btn" onclick="exitTeam()">${isAdm()?'Back to dashboard':'Log out'}</button></div><div class=card><h3>Live inventory is not available yet</h3><p style="margin:0">${m}</p></div>`;return}const base=U.filter(u=>!u.ref&&(!tTw||u.t==tTw)&&(!tCf||u.c==tCf)),n=k=>base.filter(u=>TS[u.s][0]==k).length,ts=tTw?[tTw]:['C','D'],M=new Map(U.map(u=>[u.id,u])),fl=[...new Set(U.map(u=>u.f))].sort((a,b)=>b-a),N=[1,2,3,4,5,6,7,8],ch=(k,v,l)=>`<button class="tb${({t:tTw,c:tCf,s:tSt})[k]==v?' on':''}" onclick="tf('${k}','${v}')">${l}</button>`,
cell=u=>{const[l,c]=TS[u.s],dim=tSt&&l!=tSt;return`<div class=mc style="cursor:default;border-color:${c};background:color-mix(in srgb,${c} ${u.s=='Available'?4:14}%,var(--card));${dim?'opacity:.22;':''}${tFlash.has(u.id)?'animation:fl 1s 4;':''}"><div class=r1><b>${u.no}</b><span class="bg ${u.c==3?'b3':'b2'}">${u.c}B</span></div><small>${u.ar||''} sq.ft</small><div class=st style="color:${c}">${l.toUpperCase()}</div></div>`},
list=k=>{const l=base.filter(u=>TS[u.s][0]==k);return`<div class=card><h3 style="color:${k=='Booked'?'#dc2626':'#d19a14'}">${k} units · ${l.length}</h3>${tbl(['Unit','Tower','Floor','Config.','Carpet (sq ft)','Status'],l.map(u=>[`<b>${u.id}</b>`,u.t,u.f,u.c+' BHK',u.ar||'',u.s=='On Hold'?'On hold':u.s=='Reserved'?'Token paid, blocked':'Booked']))}</div>`},
kk=(a,b,c)=>`<div class=card style="padding:12px;border-left:6px solid ${c}"><small style="color:var(--mu)">${a}</small><b style="display:block;font-size:26px">${b}</b></div>`;
t.innerHTML=`<div class=row style="justify-content:space-between;margin-bottom:14px"><div class=row><img src="${document.querySelector('.lg1').src}" style="height:44px"><img src="${document.querySelector('.lg2').src}" style="height:56px"></div><div class=row><b style="color:${tLive?'#16a34a':'#d19a14'}">${tLive?'● Live':DBH?'Waiting for live data...':'Sign in to claude.ai to see live data'}</b><button class="btn" onclick="exitTeam()">${isAdm()?'Back to dashboard':'Log out'}</button></div></div>
<h2 style="margin:0 0 12px;font-family:Georgia,serif;font-weight:500;color:#e0bd7a">Live Inventory · Unit Status</h2>
<div class=kp style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px">${kk('Total units',base.length,'#64748b')}${kk('Available',n('Available'),'#16a34a')}${kk('Blocked',n('Blocked'),'#d19a14')}${kk('Booked',n('Booked'),'#dc2626')}</div>
<div class=card style="margin-bottom:14px"><div class=row>${ch('t','','All Towers')}${ch('t','C','Tower C')}${ch('t','D','Tower D')}<span style="width:14px"></span>${ch('c','','All')}${ch('c','2','2 BHK')}${ch('c','3','3 BHK')}<span style="width:14px"></span>${ch('s','','All status')}${ch('s','Available','Available')}${ch('s','Blocked','Blocked')}${ch('s','Booked','Booked')}</div></div>
${ts.map(tw=>`<div class=card style="margin-bottom:14px"><h3>Tower ${tw}</h3><div class=ov><div class=mx><div></div>${[3,2,2,3,3,2,2,3].map((c,i)=>`<div class=mh>UNIT 0${i+1}<span class="bg ${c==3?'b3':'b2'}">${c}BHK</span></div>`).join('')}${fl.map(f=>`<div class=mf><b>${f}</b>FLOOR</div>`+N.map(k=>{const u=M.get(tw+'-'+(f*100+k));return u&&(!tCf||u.c==tCf)?cell(u):'<div></div>'}).join('')).join('')}</div></div></div>`).join('')}
<div style="display:grid;gap:14px">${list('Booked')}${list('Blocked')}</div>`}
